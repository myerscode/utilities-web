name: CI

on:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches: [ main, develop, feature/** ]
  pull_request:
    branches: [ main, develop, feature/** ]

permissions:
  contents: read

jobs:
  tests:
    uses: myerscode/workflows/.github/workflows/php-tests.yml@v1
    with:
      php-versions: "['8.5']"
      os: "['ubuntu-latest', 'macos-latest', 'windows-latest']"
      extensions: "curl, dom, filter, sockets"
      # Exclude the live-network ping suite: it shells out to the system ping
      # against real hosts, so it is nondeterministic on CI runners that block
      # outbound ICMP. Run it locally with `--group network`.
      test-command: "vendor/bin/phpunit --testdox --no-coverage --exclude-group network"

  lint:
    uses: myerscode/workflows/.github/workflows/php-lint.yml@v1
    with:
      php-version: "8.5"
      extensions: "curl, dom, filter, sockets"

  audit:
    uses: myerscode/workflows/.github/workflows/php-security-audit.yml@v1
    with:
      php-version: "8.5"
      extensions: "curl, dom, filter, sockets"

  coverage:
    uses: myerscode/workflows/.github/workflows/php-coverage.yml@v1
    with:
      php-version: "8.5"
      extensions: "curl, dom, filter, sockets"
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
